# A released version is a tag, and the page that announces it is written by
# the tag itself: the annotation is the title and the notes, so the words are
# chosen once, where the tag is made, and cannot drift from what was released.
# Nothing is built here - the check workflow already built and tested this
# commit, and a binary attached from a runner would be a build nobody measured
# on a host.
name: release

on:
  push:
    tags:
      - "v*"

# Creating the page is a write, and the repository hands workflows a read-only
# token by default.
permissions:
  contents: write

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `actions/checkout` fetches the tagged commit straight onto the tag's own
      # ref - `+<sha>:refs/tags/<tag>` - which replaces the annotated object
      # with a light one pointing at the commit. Everything below then reads the
      # commit message instead of the annotation, which is exactly how the first
      # v0.1.1 page came out carrying a commit message and no title. Fetching the
      # tag ref again by force puts the annotation back.
      - name: the annotation the tag was made with
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "$GITHUB_REF_NAME carries no annotation, so there is nothing to announce" >&2
            exit 1
          fi
          git tag --list --format='%(contents:subject)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/title"
          git tag --list --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes"
          echo "the title will be: $(cat "$RUNNER_TEMP/title")"

      # A tag naming a version the binary does not report is the failure this
      # step exists for: `--version` prints what `Cargo.toml` says, and nothing
      # else compares the two. Refusing here leaves the tag in place to be
      # fixed, rather than announcing the wrong number.
      - name: the tag and the crate agree on the version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, Cargo.toml says $crate" >&2
            exit 1
          fi
          echo "both say $crate"

      - name: the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$(cat "$RUNNER_TEMP/title")" \
            --notes-file "$RUNNER_TEMP/notes"
