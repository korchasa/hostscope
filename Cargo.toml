[package]
name = "hostscope"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
build = "build.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
# Already in the tree - ratatui draws with it. Naming it here costs no bytes and
# replaces a hand-written table of wide ranges that was missing whole blocks of
# emoji (D-18).
unicode-width = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
